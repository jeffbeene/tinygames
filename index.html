<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>tinygames — create</title>
    <link rel="stylesheet" href="/src/create/create.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <!-- Same mark as public/favicon.svg, recoloured from the theme vars. -->
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="6" fill="var(--panel)" />
          <g fill="var(--accent)">
            <path d="M5 5h9v9H5V5zm2 2v5h5V7H7z" />
            <path d="M18 5h9v9h-9V5zm2 2v5h5V7h-5z" />
            <path d="M5 18h9v9H5v-9zm2 2v5h5v-5H7z" />
          </g>
          <g fill="var(--tier-easy)">
            <rect x="18" y="18" width="3" height="3" />
            <rect x="24" y="18" width="3" height="3" />
            <rect x="21" y="21" width="3" height="3" />
            <rect x="18" y="24" width="3" height="3" />
            <rect x="24" y="24" width="3" height="3" />
          </g>
        </svg>
        <span class="brand-name">tinygames</span>
      </div>

      <div class="topbar-group">
        <label class="field">
          <span class="field-label">Example</span>
          <select id="examples" class="select">
            <option value="">Load…</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Runtime</span>
          <select id="runtime" class="select">
            <option value="0">Canvas harness</option>
            <option value="1">Bare page</option>
          </select>
        </label>
      </div>

      <div class="topbar-spacer"></div>

      <div class="topbar-group">
        <label class="toggle">
          <input type="checkbox" id="autorun" checked />
          <span>Auto-run</span>
        </label>
        <button id="run" class="btn" type="button" title="Re-run the preview (Ctrl+Enter)">Run</button>
        <button id="stop" class="btn" type="button" title="Stop the running game">Stop</button>
      </div>
    </header>

    <main class="workspace">
      <section class="pane pane-editor">
        <div class="pane-head">
          <h2 class="pane-title">Source</h2>
          <div class="pane-meta">
            <span id="src-stat" class="stat-inline">—</span>
          </div>
        </div>
        <div id="editor" class="editor-host"></div>
        <div id="problems" class="problems" hidden></div>
      </section>

      <div
        id="splitter"
        class="splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize the editor and preview panes"
        aria-valuemin="0"
        aria-valuemax="100"
        tabindex="0"
        title="Drag to resize · double-click to reset"
      ></div>

      <section class="pane pane-preview">
        <div class="pane-head">
          <h2 class="pane-title">Preview</h2>
          <div class="pane-meta">
            <select id="preview-source" class="select select-sm" title="Which build the preview runs">
              <option value="source">run source</option>
              <option value="shipped">run shipped</option>
            </select>
            <span id="preview-state" class="badge">idle</span>
          </div>
        </div>
        <div class="stage">
          <div id="frame-host" class="frame-host"></div>
        </div>

        <section class="ship" id="ship">
          <div class="pane-head ship-head">
            <h2 class="pane-title">Scan to play</h2>
            <div class="pane-meta">
              <span id="scan-note" class="scan-note"></span>
              <button
                id="qr-expand"
                class="icon-btn"
                type="button"
                title="Show the QR code large"
                aria-label="Show the QR code large"
              >⤢</button>
            </div>
          </div>

          <div class="ship-body">
            <div id="qr-holder" class="qr-holder" title="Click to enlarge">
              <div class="qr-empty">no code yet</div>
            </div>

            <div class="ship-readout">
              <div class="budget">
                <div class="budget-legend">
                  <span id="budget-text" class="budget-text">—</span>
                  <span id="budget-pct" class="budget-pct"></span>
                </div>
                <div class="budget-bar" id="budget-bar">
                  <div class="budget-fill" id="budget-fill"></div>
                  <div class="budget-ticks" id="budget-ticks"></div>
                </div>
              </div>

              <dl class="qr-stats">
                <div><dt>Symbol</dt><dd id="stat-symbol">—</dd></div>
                <div><dt>Minified</dt><dd id="stat-min">—</dd></div>
                <div><dt>Brotli</dt><dd id="stat-br">—</dd></div>
                <div><dt>URL</dt><dd id="stat-url">—</dd></div>
              </dl>
            </div>

            <div class="ship-actions">
              <div class="qr-actions">
                <button id="copy-link" class="btn btn-primary" type="button">Copy link</button>
                <button id="save-png" class="btn" type="button">PNG</button>
              </div>

              <label class="host-config">
                <span class="field-label">Play URL</span>
                <input
                  id="base-url"
                  class="input"
                  type="text"
                  spellcheck="false"
                  title="The QR encodes this prefix plus the game. Shorter is slightly cheaper, but the prefix costs under 1% of the budget."
                />
              </label>
            </div>
          </div>
        </section>
      </section>
    </main>

    <div id="lightbox" class="lightbox" hidden>
      <div class="lightbox-inner">
        <div id="lightbox-qr" class="lightbox-qr"></div>
        <p id="lightbox-caption" class="lightbox-caption"></p>
        <button id="lightbox-close" class="btn" type="button">Close</button>
      </div>
    </div>

    <script type="module" src="/src/create/main.js"></script>
  </body>
</html>
