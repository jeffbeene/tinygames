<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>tinygames</title>
    <link rel="stylesheet" href="/src/play/play.css" />
  </head>
  <body>
    <div id="stage" class="stage"></div>

    <div id="boot" class="boot">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p class="boot-text">decoding…</p>
    </div>

    <button
      id="menu-open"
      class="menu-open"
      type="button"
      hidden
      title="Options"
      aria-label="Options"
    >i</button>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-card">
        <h1 class="sheet-title">tinygames</h1>
        <p class="sheet-sub" id="sheet-sub"></p>
        <div class="sheet-actions">
          <button id="act-restart" class="btn btn-primary" type="button">Restart</button>
          <button id="act-full" class="btn" type="button">Fullscreen</button>
          <a id="act-remix" class="btn" href="/">Remix in editor</a>
        </div>
        <button id="sheet-close" class="sheet-close" type="button" aria-label="Close">Close</button>
      </div>
    </div>

    <div id="fail" class="fail" hidden>
      <div class="fail-card">
        <h1 class="fail-title" id="fail-title">Nothing to play</h1>
        <p class="fail-msg" id="fail-msg"></p>
        <a class="btn btn-primary" href="/">Open the editor</a>
      </div>
    </div>

    <script type="module" src="/src/play/main.js"></script>
  </body>
</html>
